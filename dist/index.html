<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Focus Archive</title>
  <link rel="stylesheet" href="./assets/style.css">
</head>
<body data-tool="edit">
  <header>
    <div class="mark"><img src="./assets/icon.png" alt="Focus Archive"></div>
    <div><b>FOCUS ARCHIVE</b><small>局部聚焦 · 视觉编辑器</small></div>
    <div class="spacer"></div>
    <button id="reset" type="button">重置</button>
    <button class="header-command" id="import" type="button">导入</button>
    <button class="header-command primary" id="export" type="button">导出</button>
    <input id="file" type="file" accept="image/jpeg,image/png,image/webp" hidden>
  </header>

  <main>
    <aside>
      <section>
        <div class="seg">
          <button data-shape="rect" class="on" type="button">矩形</button>
          <button data-shape="circle" type="button">圆形</button>
        </div>
        <div class="focus-param-row">
          <label class="inline-control">放大 <input id="scale" type="range" min="1" max="3" step=".01" value="1"><output id="scaleOut">1.00×</output></label>
          <label class="inline-control">旋转 <input id="rotation" type="range" min="-180" max="180" value="0"><output id="rotationOut">0°</output></label>
        </div>
        <div class="row">
          <button id="flip" type="button">水平镜像</button>
          <button id="transformReset" type="button">重置变换</button>
        </div>
      </section>
      <section class="typography-panel">
        <div class="text-content-row">
          <textarea id="text" rows="3">今晚月色真美🌕</textarea>
          <label class="repeat-control">重复次数 <input id="repeat" type="number" min="1" max="1000" step="1" value="1" inputmode="numeric"></label>
        </div>
        <div class="row typography-options">
          <label class="select-control">前后 <select id="bracket" aria-label="文字前后符号"><option value="paren">( )</option><option value="corner">「 」</option><option value="curly">{ }</option><option value="none">无</option></select></label>
          <label class="select-control">样式 <select id="font" aria-label="文字样式"><option value="sans">无衬线</option><option value="serif">衬线</option><option value="mono">等宽</option><option value="italic">倾斜</option></select></label>
          <label class="emoji-tone">去色 <input id="emojiTone" type="checkbox"></label>
        </div>
        <div class="text-size-row">
          <label class="inline-control">字高 <input id="textSize" type="range" min="12" max="72" value="24"><output id="textSizeOut">24px</output></label>
          <label class="inline-control">错落 <input id="stagger" type="range" min="0" max="1" step=".01" value="0"><output id="staggerOut">0.00</output></label>
          <button id="randomize" type="button">重置位置</button>
        </div>
      </section>
    </aside>

    <section class="stage">
      <div class="stage-head recording-head">
        <div class="record-actions"><button id="recordStart" type="button">录制</button><button id="recordStop" type="button" disabled>结束</button><button id="recordPlay" type="button" disabled>回放</button></div>
        <label class="timeline-control"><span>参数时间轴</span><input id="timeline" type="range" min="0" max="1" value="0" disabled><output id="timelineOut">00:00</output></label>
      </div>
      <div class="board-wrap">
        <div id="board">
          <canvas id="canvas"></canvas>
          <svg id="overlay"></svg>
          <i class="corner tl"></i><i class="corner tr"></i><i class="corner bl"></i><i class="corner br"></i>
        </div>
      </div>
    </section>

    <aside class="right">
      <section>
        <div class="color-groups">
          <div class="color-group">
            <h3>背景</h3>
            <div id="bgControls" class="parameter-grid"></div>
            <div class="parameter-grid effect-grid">
              <label>模糊 <output id="blurOut">1px</output><input id="blur" type="range" min="0" max="30" value="1"></label>
              <label>噪点 <output id="noiseOut">1px</output><input id="noise" type="range" min="0" max="16" value="1"></label>
            </div>
          </div>
          <div class="color-group">
            <h3>突出区域</h3>
            <div id="focusControls" class="parameter-grid"></div>
          </div>
        </div>
        <button id="colorReset" class="color-reset" type="button">重置效果</button>
      </section>
    </aside>
  </main>

  <nav class="tool-dock" aria-label="编辑工具">
    <button data-mobile-tool="edit" class="on" type="button"><span>编辑</span></button>
    <button data-mobile-tool="color" type="button"><span>调色</span></button>
    <button data-mobile-tool="text" type="button"><span>文字</span></button>
  </nav>

  <dialog id="dialog">
    <button id="close" type="button">关闭</button>
    <p>导出</p>
    <img id="result" alt="导出预览">
    <div class="export-actions"><button id="saveAlbum" type="button">保存图片</button><button id="saveAnimation" type="button" disabled>保存动画</button></div>
    <p id="exportStatus" role="status" aria-live="polite"></p>
  </dialog>
  <script src="./assets/platform/xhs-minitool.js"></script>
  <script src="./assets/webp-animation.js"></script>
  <script src="./assets/mp4-standard.js"></script>
  <script src="./assets/app.js"></script>
</body>
</html>
